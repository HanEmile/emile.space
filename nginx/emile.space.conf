server {
    listen 80;
    listen [::]:80;
    server_name emile.space www.emile.space;

    # Redirect HTTP -> HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name emile.space www.emile.space;

    # Managed by Certbot (or replace with your cert paths)
    ssl_certificate     /etc/letsencrypt/live/emile.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/emile.space/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root  /var/www/emile.space;
    index index.html;

    # Clean URLs: /blog -> /blog.html if it exists, else try exact file, else 404
    location / {
        try_files $uri $uri.html =404;
    }

    # Custom 404 page (create input/404.md to generate it)
    error_page 404 /404.html;

    # Cache static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Compression
    gzip on;
    gzip_vary on;
    gzip_types
        text/html
        text/css
        text/plain
        application/javascript
        image/svg+xml;
}
